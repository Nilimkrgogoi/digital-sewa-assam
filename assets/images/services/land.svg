<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="landBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="parchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#landBg)"/>
  <!-- Parchment / Land Document RoR Sheet -->
  <rect x="22" y="20" width="76" height="80" rx="6" fill="url(#parchment)" stroke="#ffffff" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.25))"/>
  <!-- Top Seal -->
  <circle cx="60" cy="34" r="7" fill="#b45309"/>
  <circle cx="60" cy="34" r="5" fill="#fef3c7"/>
  <circle cx="60" cy="34" r="3" fill="#b45309"/>
  <!-- Land Map Grid / Dag & Patta sketch -->
  <rect x="30" y="46" width="60" height="24" rx="4" fill="#fef9c3" stroke="#d97706" stroke-width="1.2"/>
  <line x1="50" y1="46" x2="50" y2="70" stroke="#d97706" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="70" y1="46" x2="70" y2="70" stroke="#d97706" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="30" y1="58" x2="90" y2="58" stroke="#d97706" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Land Map labels -->
  <text x="40" y="54" fill="#92400e" font-size="5" font-family="Arial" font-weight="bold">PATTA</text>
  <text x="60" y="54" fill="#92400e" font-size="5" font-family="Arial" font-weight="bold">DAG 12</text>
  <text x="80" y="54" fill="#92400e" font-size="5" font-family="Arial" font-weight="bold">BIGHÁ</text>
  <text x="50" y="66" fill="#15803d" font-size="5" font-family="Arial" font-weight="bold">JAMABANDI</text>
  <!-- Text lines -->
  <rect x="30" y="76" width="60" height="3" rx="1.5" fill="#78350f"/>
  <rect x="30" y="82" width="45" height="3" rx="1.5" fill="#92400e"/>
  <!-- Official Stamp Badge -->
  <rect x="62" y="86" width="28" height="10" rx="3" fill="#15803d"/>
  <text x="76" y="93" fill="#ffffff" font-size="5" font-family="Arial" font-weight="bold" text-anchor="middle">REVENUE</text>
</svg>
