<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="resumeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#resumeBg)"/>
  <!-- Resume Sheet with folded corner -->
  <path d="M26 22 L76 22 L94 40 L94 98 L26 98 Z" fill="url(#sheetGrad)" stroke="#ffffff" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.25))"/>
  <path d="M76 22 L76 40 L94 40 Z" fill="#e2e8f0"/>
  <!-- Profile Photo Box on CV -->
  <rect x="34" y="32" width="18" height="20" rx="3" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <circle cx="43" cy="40" r="4" fill="#4f46e5"/>
  <path d="M37 50 C37 45 49 45 49 50 Z" fill="#4f46e5"/>
  <!-- Name & Title -->
  <rect x="56" y="34" width="28" height="4" rx="2" fill="#1e1b4b"/>
  <rect x="56" y="41" width="20" height="3" rx="1.5" fill="#6366f1"/>
  <rect x="56" y="47" width="24" height="2.5" rx="1" fill="#94a3b8"/>
  <!-- Horizontal divider -->
  <line x1="34" y1="58" x2="86" y2="58" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Section: Experience / Education Bullets -->
  <circle cx="37" cy="66" r="2" fill="#4f46e5"/>
  <rect x="43" y="64.5" width="42" height="3" rx="1.5" fill="#334155"/>
  <rect x="43" y="70" width="32" height="2.5" rx="1" fill="#64748b"/>
  
  <circle cx="37" cy="78" r="2" fill="#4f46e5"/>
  <rect x="43" y="76.5" width="40" height="3" rx="1.5" fill="#334155"/>
  <rect x="43" y="82" width="26" height="2.5" rx="1" fill="#64748b"/>
  
  <!-- Skill tags pill badges -->
  <rect x="34" y="88" width="16" height="5" rx="2.5" fill="#e0e7ff"/>
  <rect x="53" y="88" width="16" height="5" rx="2.5" fill="#e0e7ff"/>
  <rect x="72" y="88" width="14" height="5" rx="2.5" fill="#e0e7ff"/>
</svg>
