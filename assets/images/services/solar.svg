<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="solarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#solarBg)"/>
  <circle cx="60" cy="60" r="48" fill="#fffbeb"/>
  <!-- Sun radiating behind roof -->
  <circle cx="60" cy="40" r="16" fill="#fbbf24"/>
  <g stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round">
    <line x1="60" y1="18" x2="60" y2="12"/>
    <line x1="38" y1="24" x2="33" y2="19"/>
    <line x1="82" y1="24" x2="87" y2="19"/>
  </g>
  <!-- House Roof with Solar Panels -->
  <!-- House base -->
  <polygon points="60,38 22,64 98,64" fill="#0f172a"/>
  <!-- Solar Panel Grid on roof -->
  <polygon points="60,42 32,62 88,62" fill="#0284c7"/>
  <!-- Solar Grid Lines -->
  <line x1="46" y1="52" x2="74" y2="52" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="53" y1="42" x2="48" y2="62" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="67" y1="42" x2="72" y2="62" stroke="#38bdf8" stroke-width="1.2"/>
  <!-- House walls -->
  <rect x="34" y="64" width="52" height="26" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <rect x="52" y="72" width="16" height="18" rx="2" fill="#0f172a"/>
  <circle cx="64" cy="81" r="1.5" fill="#f59e0b"/>
</svg>
